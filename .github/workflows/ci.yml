name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      use_bad_model:
        description: "Evaluate the untrained Pythia-70M to show the quality gate failing"
        type: boolean
        default: false

jobs:
  # 1) Linting
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.4
      - run: ruff check worker training service scripts tests

  # 2) Unit tests (at least three)
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.4 boto3==1.43.123
      - run: pytest

  # 3) Model evaluation from the GitHub Release + 4) quality gate
  eval:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only torch + transformers
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.46.3 pyyaml==6.0.3
      - name: Select model
        env:
          GH_TOKEN: ${{ github.token }}
          USE_BAD: ${{ github.event.inputs.use_bad_model }}
        run: |
          if [ "$USE_BAD" = "true" ]; then
            echo "Using the untrained base model (deliberately bad)"
            echo "MODEL=EleutherAI/pythia-70m" >> "$GITHUB_ENV"
          else
            echo "Downloading the trained model from the GitHub Release"
            gh release download v1 --pattern 'pythia70m-v1.tar.gz'
            mkdir -p model && tar -xzf pythia70m-v1.tar.gz -C model
            echo "MODEL=model/v1" >> "$GITHUB_ENV"
          fi
      - name: Evaluate on validation.jsonl
        run: |
          python training/predict.py --model "$MODEL" --out results/ci_predictions.jsonl
          python tools/score.py results/ci_predictions.jsonl data/validation.jsonl --out results/ci_report.json
      - name: Quality gate (JSON validity >= 95%)
        run: python tools/score.py results/ci_predictions.jsonl data/validation.jsonl --min-validity 95

  # 5) Secret scan - must report nothing
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --source . --redact --no-banner
