# Traefik Ingress (k3s ships Traefik as the default IngressClass). Routes all
# paths - including /parse - to the parser Service. Reachable from the host at
# http://localhost:8080 because the k3d load balancer maps host 8080 -> 80.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parser
  namespace: app
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: parser
                port:
                  number: 80
