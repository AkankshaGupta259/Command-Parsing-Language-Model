# SeaweedFS object storage (S3-compatible) for namespace `data`.
# Single all-in-one pod (master + volume + filer + S3 gateway) — enough for a
# laptop cluster. Buckets live on a PVC so model artifacts survive pod restarts.
#
# This manifest contains NO credentials. The S3 identity (access/secret key) is
# supplied at deploy time through the Secret `seaweedfs-s3-config` (generated by
# scripts/bootstrap_storage.py, never committed) and mounted as s3config.json.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path        # k3d's built-in provisioner
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: data
  labels: {app: seaweedfs}
spec:
  replicas: 1
  strategy: {type: Recreate}          # single RWO volume: don't run two at once
  selector:
    matchLabels: {app: seaweedfs}
  template:
    metadata:
      labels: {app: seaweedfs}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args:
            - server
            - -dir=/data
            - -master.volumeSizeLimitMB=1024
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3config.json
          ports:
            - {name: s3,     containerPort: 8333}
            - {name: master, containerPort: 9333}
            - {name: filer,  containerPort: 8888}
            - {name: volume, containerPort: 8080}
          volumeMounts:
            - {name: data,     mountPath: /data}
            - {name: s3config, mountPath: /etc/seaweedfs, readOnly: true}
          readinessProbe:
            tcpSocket: {port: 8333}
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 9333}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits:   {cpu: "1",    memory: "1Gi"}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: seaweedfs-data}
        - name: s3config
          secret:
            secretName: seaweedfs-s3-config
            items:
              - {key: s3config.json, path: s3config.json}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: data
  labels: {app: seaweedfs}
spec:
  selector: {app: seaweedfs}
  ports:
    - {name: s3,     port: 8333, targetPort: 8333}
    - {name: filer,  port: 8888, targetPort: 8888}
    - {name: master, port: 9333, targetPort: 9333}
